# nginx site config template for the Frog-is site: replace example.com with the real domain.
# Place at /etc/nginx/sites-available/frogis and symlink into sites-enabled.
# After the cert is issued by certbot, certbot rewrites/extends this with the 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 210m;   # admin uploads: videos up to 200 MB

    # Uploaded media straight from disk; anything nginx cannot find goes to the app.
    location /uploads/ {
        root /var/www/frogis/public;
        try_files $uri @frogis;
        expires 30d;
        access_log off;
    }

    # Hashed build assets
    location /_next/static/ {
        alias /var/www/frogis/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;         # large uploads
        proxy_request_buffering off;
    }

    location @frogis {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
